# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Intraday"

[setup]
script = ""

[setup.win32]
script = '''
@echo off

cd "%CODEX_WORKTREE_PATH%"

echo =====================================
echo NTIS Codex Environment Setup
echo =====================================

python -m pip install --upgrade pip

if exist "..\requirements.txt" (
    echo Installing project dependencies...
    pip install -r "..\requirements.txt"
) else (
    echo ERROR: ..\requirements.txt not found
    exit /b 1
)

echo =====================================
echo Environment Ready
echo =====================================

python --version
pip list'''

[[actions]]
name = "Run Intraday Pipeline"
icon = "tool"
command = '''
@echo off

cd "%CODEX_WORKTREE_PATH%"

echo ===================================
echo Running NTIS Intraday Pipeline
echo ===================================

python run_intraday_pipeline.py

echo.
echo ===================================
echo Pipeline Completed
echo ===================================

pause'''
platform = "win32"

[[actions]]
name = "Run Replay"
icon = "tool"
